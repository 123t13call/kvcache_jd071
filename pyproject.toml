[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "123t13call-kvcache_jd071"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "123t13call" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://123t13call.github.io"
Repository = "https://github.com/123t13call/kvcache_jd071"
Issues = "https://github.com/123t13call/kvcache_jd071/issues"

[project.scripts]
kvcache_jd071 = "kvcache_jd071:main"

[tool.setuptools]
py-modules = ["kvcache_jd071"]
